<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objets Perdus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Objets Perdus</h1>
    </header>

    <main class="container">
        <!-- Submission Form -->
        <section class="form-section">
            <h2>Report a Lost Item</h2>
            <form id="lostItemForm">
                <div class="form-group">
                    <label for="itemName">Item Name:</label>
                    <input type="text" id="itemName" required placeholder="e.g., Blue Avengers Thermos">
                </div>
                
                <div class="form-group">
                    <label for="description">Description / Where Lost:</label>
                    <textarea id="description" required placeholder="e.g., Left on the playground benches."></textarea>
                </div>

                <div class="form-group">
                    <label for="parentName">Your Name:</label>
                    <input type="text" id="parentName" required placeholder="e.g., Jane Doe">
                </div>

                <div class="form-group">
                    <label for="contact">Contact Info (Email/Phone):</label>
                    <input type="text" id="contact" required placeholder="e.g., jane.doe@email.com">
                </div>

                <button type="submit" class="btn">Submit Item</button>
            </form>
            <div id="formStatus" class="hidden"></div>
        </section>

        <!-- The Live Board -->
        <section class="board-section">
            <h2>Current Lost Items</h2>
            <div id="itemsContainer" class="items-grid">
                <p class="loading">Loading current board items...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
