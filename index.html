<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objets Perdus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Objets Perdus</h1>
    </header>

    <main class="container">
        <!-- Submission Form -->
        <section class="form-section">
            <h2>Signaler un objet perdu</h2>
            <form id="lostItemForm">
                <div class="form-group">
                    <label for="itemName">Objet:</label>
                    <input type="text" id="itemName" required placeholder="e.g., Thermos Bleu">
                </div>
                
                <div class="form-group">
                    <label for="description">Description / lieu:</label>
                    <textarea id="description" required placeholder="e.g., laisé sur un banc"></textarea>
                </div>

                <div class="form-group">
                    <label for="location">Quel Campus ?</label>
                    <select id="location" required>
                        <option value="">Choisir un Campus</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="parentName">Votre Nom:</label>
                    <input type="text" id="parentName" required placeholder="e.g., Jane Doe">
                </div>

                <div class="form-group">
                    <label for="contact">Coordonnées (Email/Téléphone):</label>
                    <input type="text" id="contact" required placeholder="e.g., jane.doe@email.com">
                </div>
                <div class="form-group">
                    <label for="image">Photo (facultatif):</label>
                    <input type="file" id="image" accept="image/*">
                </div>
                <button type="submit" class="btn">Soumettre</button>
            </form>
            <div id="formStatus" class="hidden"></div>
        </section>

        <!-- The Live Board -->
        <section class="board-section">
            <div class="board-header">
                <h2>Objets Perdus</h2>
                <div class="board-actions">
                    <div class="filter-wrap">
                        <button type="button" id="filterBtn" class="filter-btn, hidden" aria-haspopup="true" aria-expanded="false">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18l-7 8v7l-4 2v-9z"/></svg>
                            <span class="filter-label">Filter</span>
                        </button>
                        <div id="filterMenu" class="filter-menu hidden" role="menu"></div>
                    </div>
                </div>
            </div>
            <div id="itemsContainer" class="items-grid">
                <p class="loading">Mise à jour du tableau des objets...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
